<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <title>MoveZ</title>
  <defs>
    <!-- Deep indigo to violet, lit from the top left -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4F46E5"/>
      <stop offset="0.55" stop-color="#5B32D6"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.22" cy="0.12" r="0.85">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.28"/>
      <stop offset="0.6" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E0E7FF"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#1E1B4B" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- App tile -->
  <rect width="1024" height="1024" rx="232" fill="url(#bg)"/>
  <rect width="1024" height="1024" rx="232" fill="url(#glow)"/>
  <rect x="6" y="6" width="1012" height="1012" rx="226" fill="none" stroke="#FFFFFF" stroke-opacity="0.14" stroke-width="12"/>

  <!-- The mark: a "Z" drawn as one transfer path that ends in an arrow -->
  <g filter="url(#shadow)" transform="translate(10 -19)">
    <path d="M300 318 H700 L330 690 H596"
          fill="none" stroke="url(#mark)" stroke-width="112"
          stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M586 600 L740 690 L586 780 Z"
          fill="url(#mark)" stroke="url(#mark)" stroke-width="40" stroke-linejoin="round"/>
    <!-- Origin node: where the session starts -->
    <circle cx="300" cy="318" r="30" fill="#7C3AED"/>
  </g>
</svg>
