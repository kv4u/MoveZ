<!doctype html>
<!-- Source for branding/social-card.png (1280×640 Open Graph image), rendered by render-card.mjs -->
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;500;600;700&display=swap">
<style>
  html, body { margin: 0; width: 1280px; height: 640px; }
  body {
    font-family: "Manrope", "Segoe UI", system-ui, sans-serif;
    color: #f4f4f2; overflow: hidden; position: relative;
    background: #0b0b0c;
  }
  /* The website's slate-to-sand hero panel */
  .panel { position: absolute; inset: 28px; border-radius: 40px; overflow: hidden;
    background:
      radial-gradient(120% 80% at 85% 110%, #d8c4a3 0%, rgba(216,196,163,0) 55%),
      radial-gradient(90% 70% at 10% 100%, #8a8f86 0%, rgba(138,143,134,0) 60%),
      linear-gradient(180deg, #1f2b30 0%, #34474c 45%, #8b8a7c 80%, #c8b596 100%); }
  .panel svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .panel path { fill: none; stroke: rgba(255,255,255,.5); stroke-width: 1.5; }
  .content { position: absolute; inset: 28px; padding: 64px 80px; display: flex; flex-direction: column; }
  .brand { display: flex; align-items: center; gap: 18px; font-size: 36px; font-weight: 700; letter-spacing: -0.01em; }
  .brand img { width: 72px; height: 72px; }
  h1 { font-weight: 300; font-size: 84px; line-height: 1.02; letter-spacing: -0.045em; margin: 48px 0 0; max-width: 900px; }
  .pills { display: flex; gap: 10px; margin-top: auto; }
  .pill { padding: 8px 18px; border-radius: 999px; font-size: 21px; font-weight: 600; color: #111;
          background: #e8e8e6; }
  .b { background: #e7b68f; } .c { background: #a9d4c4; } .d { background: #b8bff0; }
  .e { background: #eeeaa2; } .f { background: #c9b6e6; }
</style>
</head>
<body>
  <div class="panel">
    <svg viewBox="0 0 1224 584" preserveAspectRatio="none"><path d="M560 600 C 760 540, 880 420, 1000 350 S 1160 210, 1240 100"/></svg>
  </div>
  <div class="content">
    <div class="brand"><img src="icon.svg" alt="">MoveZ</div>
    <h1>Your AI coding sessions, anywhere you work.</h1>
    <div class="pills">
      <span class="pill">Cursor</span><span class="pill b">Claude Code</span><span class="pill c">Codex</span>
      <span class="pill d">Copilot CLI</span><span class="pill e">Cline</span><span class="pill f">Continue</span>
    </div>
  </div>
</body>
</html>
