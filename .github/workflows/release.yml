name: Release

on:
  push:
    tags:
      - "v*"
  # Build (but never publish) on PRs that touch packaging, so platform builds are tested before a release
  pull_request:
    paths:
      - "electron-app/**"
      - ".github/workflows/release.yml"

permissions:
  contents: write

jobs:
  build-phar:
    name: Build CLI PHAR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: pdo_sqlite, openssl, zip, mbstring
          ini-values: phar.readonly=0

      - name: Install CLI dependencies (no dev)
        working-directory: movez
        run: composer install --no-dev --optimize-autoloader --no-interaction

      - name: Build PHAR
        working-directory: movez
        run: php movez app:build movez.phar --build-version=${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'dev' }} --no-interaction

      - name: Smoke test PHAR
        working-directory: movez
        run: |
          php builds/movez.phar --version
          php builds/movez.phar list --raw | grep -q '^export'

      - uses: actions/upload-artifact@v4
        with:
          name: movez-phar
          path: movez/builds/movez.phar

  build-vsix:
    name: Build VS Code Extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: vscode-extension/package-lock.json

      - name: Install extension dependencies
        working-directory: vscode-extension
        run: npm ci

      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: vscode-extension
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      - name: Package extension
        working-directory: vscode-extension
        run: npx vsce package --no-dependencies --out movez-vscode.vsix

      - uses: actions/upload-artifact@v4
        with:
          name: movez-vsix
          path: vscode-extension/movez-vscode.vsix

  build-desktop:
    name: Build Desktop App (${{ matrix.name }})
    needs: build-phar
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            target: win
            arch: x64
            artifact: electron-app/dist/*.exe
          - name: macOS (Apple Silicon)
            os: macos-latest
            target: mac
            arch: arm64
            php: php-8.3.32-cli-macos-aarch64.tar.gz
            artifact: electron-app/dist/*.dmg
          # Built natively on an Intel runner so the bundled PHP check runs on x86-64
          - name: macOS (Intel)
            os: macos-15-intel
            target: mac
            arch: x64
            php: php-8.3.32-cli-macos-x86_64.tar.gz
            artifact: electron-app/dist/*.dmg
          - name: Linux
            os: ubuntu-latest
            target: linux
            arch: x64
            php: php-8.3.32-cli-linux-x86_64.tar.gz
            artifact: electron-app/dist/*.AppImage
    env:
      # The app is not code-signed yet; don't let electron-builder look for certificates
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: electron-app/package-lock.json

      - uses: actions/download-artifact@v4
        with:
          name: movez-phar
          path: electron-app/resources

      - name: Bundle PHP runtime (Windows)
        if: matrix.target == 'win'
        shell: pwsh
        working-directory: electron-app/resources
        run: |
          Invoke-WebRequest -Uri "https://windows.php.net/downloads/releases/latest/php-8.3-nts-Win32-vs16-x64-latest.zip" -OutFile php.zip
          Expand-Archive php.zip -DestinationPath php
          Remove-Item php.zip
          @(
            'extension_dir = "ext"',
            'extension=openssl',
            'extension=pdo_sqlite',
            'extension=zip',
            'extension=mbstring',
            'extension=fileinfo'
          ) | Set-Content -Encoding ascii php/php.ini
          php/php.exe -v
          php/php.exe movez.phar --version

      # Static PHP builds from static-php-cli: one self-contained binary with the
      # extensions compiled in (no php.ini or extension files needed)
      - name: Bundle PHP runtime (macOS / Linux)
        if: matrix.target != 'win'
        working-directory: electron-app/resources
        run: |
          mkdir -p php
          curl -fsSL "https://dl.static-php.dev/static-php-cli/common/${{ matrix.php }}" | tar -xz -C php
          chmod +x php/php
          php/php -v
          for ext in openssl pdo_sqlite zip mbstring fileinfo; do
            php/php -m | grep -qix "$ext" || { echo "Bundled PHP is missing the $ext extension"; exit 1; }
          done
          php/php movez.phar --version

      - name: Install desktop dependencies
        working-directory: electron-app
        run: npm ci

      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: electron-app
        shell: bash
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      - name: Build app
        working-directory: electron-app
        run: npm run package -- --${{ matrix.target }} --${{ matrix.arch }} --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: movez-desktop-${{ matrix.target }}-${{ matrix.arch }}
          path: ${{ matrix.artifact }}

  publish:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-phar, build-vsix, build-desktop]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          name: MoveZ ${{ github.ref_name }}
          files: artifacts/*
          body: |
            ## MoveZ ${{ github.ref_name }}

            | File | What it is |
            |---|---|
            | `MoveZ-Setup-*.exe` | Windows desktop app (bundles PHP and the CLI) |
            | `MoveZ-*-mac-arm64.dmg` | macOS desktop app for Apple Silicon (unsigned: right-click → Open the first time) |
            | `MoveZ-*-mac-x64.dmg` | macOS desktop app for Intel Macs (unsigned: right-click → Open the first time) |
            | `MoveZ-*-linux-x86_64.AppImage` | Linux desktop app (`chmod +x`, then run) |
            | `movez.phar` | Cross-platform CLI (needs PHP 8.2+ with pdo_sqlite, openssl, zip, mbstring) |
            | `movez-vscode.vsix` | VS Code / Cursor extension — install with "Extensions: Install from VSIX…" |

            ### CLI quick start
            ```bash
            curl -L https://github.com/kv4u/MoveZ/releases/latest/download/movez.phar -o movez
            chmod +x movez && sudo mv movez /usr/local/bin/movez
            movez doctor
            ```
