name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-phar:
    name: Build CLI PHAR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: pdo_sqlite, openssl, zip, mbstring
          ini-values: phar.readonly=0

      - name: Install CLI dependencies (no dev)
        working-directory: movez
        run: composer install --no-dev --optimize-autoloader --no-interaction

      - name: Build PHAR
        working-directory: movez
        run: php movez app:build movez.phar --build-version=${{ github.ref_name }} --no-interaction

      - name: Smoke test PHAR
        working-directory: movez
        run: |
          php builds/movez.phar --version
          php builds/movez.phar list --raw | grep -q '^export'

      - uses: actions/upload-artifact@v4
        with:
          name: movez-phar
          path: movez/builds/movez.phar

  build-vsix:
    name: Build VS Code Extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: vscode-extension/package-lock.json

      - name: Install extension dependencies
        working-directory: vscode-extension
        run: npm ci

      - name: Set version from tag
        working-directory: vscode-extension
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      - name: Package extension
        working-directory: vscode-extension
        run: npx vsce package --no-dependencies --out movez-vscode.vsix

      - uses: actions/upload-artifact@v4
        with:
          name: movez-vsix
          path: vscode-extension/movez-vscode.vsix

  build-desktop:
    name: Build Windows Desktop Installer
    needs: build-phar
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: electron-app/package-lock.json

      - uses: actions/download-artifact@v4
        with:
          name: movez-phar
          path: electron-app/resources

      - name: Bundle PHP runtime
        shell: pwsh
        working-directory: electron-app/resources
        run: |
          Invoke-WebRequest -Uri "https://windows.php.net/downloads/releases/latest/php-8.3-nts-Win32-vs16-x64-latest.zip" -OutFile php.zip
          Expand-Archive php.zip -DestinationPath php
          Remove-Item php.zip
          @(
            'extension_dir = "ext"',
            'extension=openssl',
            'extension=pdo_sqlite',
            'extension=zip',
            'extension=mbstring',
            'extension=fileinfo'
          ) | Set-Content -Encoding ascii php/php.ini
          php/php.exe -v
          php/php.exe movez.phar --version

      - name: Install desktop dependencies
        working-directory: electron-app
        run: npm ci

      - name: Set version from tag
        working-directory: electron-app
        shell: pwsh
        run: npm version "$("${{ github.ref_name }}".TrimStart('v'))" --no-git-tag-version --allow-same-version

      - name: Build installer
        working-directory: electron-app
        run: npm run package -- --win --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: movez-desktop
          path: electron-app/dist/*.exe

  publish:
    name: Publish GitHub Release
    needs: [build-phar, build-vsix, build-desktop]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          name: MoveZ ${{ github.ref_name }}
          files: artifacts/*
          body: |
            ## MoveZ ${{ github.ref_name }}

            | File | What it is |
            |---|---|
            | `MoveZ-Setup-*.exe` | Windows desktop app (bundles PHP and the CLI) |
            | `movez.phar` | Cross-platform CLI (needs PHP 8.2+ with pdo_sqlite, openssl, zip, mbstring) |
            | `movez-vscode.vsix` | VS Code / Cursor extension — install with "Extensions: Install from VSIX…" |

            ### CLI quick start
            ```bash
            curl -L https://github.com/kv4u/MoveZ/releases/latest/download/movez.phar -o movez
            chmod +x movez && sudo mv movez /usr/local/bin/movez
            movez doctor
            ```
