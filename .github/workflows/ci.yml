name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main, master]

jobs:
  cli-tests:
    name: CLI Tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ["8.2", "8.3"]
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite, openssl, zip, mbstring, json
          coverage: none

      - name: Install CLI dependencies
        working-directory: movez
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Run CLI tests
        working-directory: movez
        run: php vendor/bin/pest
        env:
          MOVEZ_KEY_PATH: /tmp/movez_test_key
          MOVEZ_TOKEN_PATH: /tmp/movez_test_token

  web-tests:
    name: Web Tests (PHP 8.2 + Node 20)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: pdo_sqlite, mbstring, openssl, zip, bcmath, pcntl, posix

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install PHP dependencies
        working-directory: web
        run: composer install --no-interaction --prefer-dist

      - name: Install Node dependencies
        working-directory: web
        run: npm ci

      - name: Type check frontend
        working-directory: web
        run: npm run type-check

      - name: Build frontend assets
        working-directory: web
        run: npm run build

      - name: Setup environment
        working-directory: web
        run: |
          cp .env.example .env
          php artisan key:generate
          touch database/database.sqlite

      - name: Run migrations
        working-directory: web
        run: php artisan migrate --force

      - name: Run web PHP tests
        working-directory: web
        run: php artisan test

      - name: Seed demo data for end-to-end tests
        working-directory: web
        run: php artisan db:seed --force

      - name: Install Playwright browser
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: Run end-to-end tests
        working-directory: web
        run: |
          php artisan serve --port=8000 > /tmp/serve.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8000/login > /dev/null && break; sleep 1; done
          npx playwright test
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:8000

  extension-build:
    name: VS Code Extension Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: vscode-extension/package-lock.json

      - name: Install extension dependencies
        working-directory: vscode-extension
        run: npm ci

      - name: Type check and compile
        working-directory: vscode-extension
        run: npm test

      - name: Package VSIX (non-interactive)
        working-directory: vscode-extension
        run: npx vsce package --no-dependencies --out movez-vscode.vsix

  desktop-typecheck:
    name: Desktop App Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: electron-app/package-lock.json

      - name: Install desktop dependencies
        working-directory: electron-app
        run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"

      - name: Type check
        working-directory: electron-app
        run: npm run typecheck

      - name: Build
        working-directory: electron-app
        run: npm run build
