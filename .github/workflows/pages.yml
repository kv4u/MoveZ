name: Website

# Publishes site/ (plus branding and screenshots) to GitHub Pages.
# Requires Settings → Pages → Source: "GitHub Actions".
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "branding/**"
      - "docs/screenshots/**"
      - "scripts/build-site.sh"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble site
        run: bash scripts/build-site.sh

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site-dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
